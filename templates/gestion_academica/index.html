{% extends "gestion_academica/home.html" %}
{% block titulo %} Inicio {% endblock %}
{% block contenido %}

<style>
    .small-box {
        display: flex;
        flex-direction: column; 
        justify-content: center; 
        align-items: center;
        main-height: 100%;  
        border-radius: 10px; 
        position: relative; 
        margin-bottom: 1px; /* Espacio inferior entre cajas */
    }

    .small-box .icon {
        color: rgba(0, 0, 0, 0.15);
        font-size: 70px;  
        position: absolute;  
        top: 10px;  
        right: 15px;  
        z-index: 0; 
    }

    .small-box h4 {
        color: #ffffff; 
    }

    .small-box h1 {
        color: white; 
        font-weight: bold; 
        font-size: 3rem;
        display: block; 
    }
    
    .numero-con-icono {
        display: flex;
        justify-content: space-between; /* Alinea el número y el ícono en extremos opuestos */
        align-items: center;
        color: white;
        font-weight: bold;
        font-size: 3rem;
    }
    
    
    .small-box .small-box-footer {
        background: rgba(0, 0, 0, 0.1);
        color: #000;
        display: block;
        padding: 3px 0;
        position: relative;
        text-align: center;
        text-decoration: none;
        z-index: 10;
    }
</style>

    <div class="container-fluid p-0">
        <h1 class="h3 mb-3"><strong>Panel de análisis</strong></h1>
    </div>

    <!-- Scripts al final del body -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <!-- AdminLTE JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.1/dist/js/adminlte.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <!-- Adaptador de fechas para Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

    <!-- Mapa -->
    <script src="https://cdn.jsdelivr.net/npm/jqvmap@1.5.1/dist/jquery.vmap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jqvmap@1.5.1/dist/maps/jquery.vmap.world.js"></script>

    <script>
        // Verifica los datos en la consola
        console.log("Datos de registrosPorFecha:", {{ registrosPorFecha | tojson }});
        console.log("Datos de ppp_finalizadas:", {{ ppp_finalizadas | tojson }});
    
    /**# Gráfico de lineas */   
        var registrosPorFecha = {{ registrosPorFecha | tojson}}; 

        var nombres = registrosPorFecha.map(r => r.nombre); // Eje x: nombres de los semestres
        var total_ids = registrosPorFecha.map(r => r.total_id); // Eje y: total de estudiantes registrados
    
        var ctxRevenue = document.getElementById('revenue-chart-canvas').getContext('2d');
        var revenueChart = new Chart(ctxRevenue, {
            type: 'line',
            data: {
                labels: nombres, // Eje x
                datasets: [{
                    label: 'Estudiantes Registrados por Semestre Académico',
                    data: total_ids, // Eje y
                    borderColor: 'rgba(60,141,188,0.8)',
                    backgroundColor: 'rgba(60,141,188,0.4)',
                    fill: true, 
                    tension: 0.4,
                    borderWidth: 2
                }]
            },
            options: {
                maintainAspectRatio: false,
                responsive: true,
                scales: {
                    x: {
                        type: 'category',
                        title: {
                            display: true,
                            text: 'Ciclo'
                        },
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 7
                        }
                    },
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Cantidad de Estudiantes'
                        },
                        ticks: {
                            stepSize: 1,
                            callback: function(value) { return Number.isInteger(value) ? value : null; }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    }
                },
                interaction: {
                    mode: 'nearest',
                    intersect: false,
                    axis: 'x'
                }
            }
        });
        

    /**# Gráfico de Torta */
        const totalConFecha = {{ ppp_finalizadas['total_con_fecha']}}; 
        const totalSinFecha = {{ ppp_finalizadas['total_sin_fecha']}}; 

        //Configuración el gráfico usando Chart.js
        const ctx = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Prácticas Finalizadas', 'Prácticas Iniciadas'],
                datasets: [{
                    label: 'Prácticas Preprofesionales',
                    data: [totalConFecha, totalSinFecha],
                    backgroundColor: [
                        'rgba(0, 123, 255, 0.7)',  // Azul fuerte para 'Con Fecha'
                        'rgba(255, 165, 0, 0.7)'   // Anaranjado para 'Sin Fecha'
                    ],
                    borderColor: [
                        'rgba(0, 123, 255, 1)',
                        'rgba(255, 165, 0, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.raw;
                            }
                        }
                    },
                    datalabels: {
                        color: '#fff',
                        font: {
                            size: 22,
                            weight: 'bold'
                        },
                        formatter: (value, ctx) => {
                            return value; // Muestra el valor directamente en el gráfico
                        }
                    }
                }
            },
            plugins: [ChartDataLabels]
        });

        
    </script>
{% endblock %}
