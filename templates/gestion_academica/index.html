{% extends "gestion_academica/home.html" %}

<head>  
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Ionicons -->
    <link rel="stylesheet" href="https://unpkg.com/ionicons@5.5.2/dist/css/ionicons.min.css">

    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.1/dist/css/adminlte.min.css">

    <!-- JQVMap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jqvmap@1.5.1/dist/jqvmap.min.css">
</head> 
{% block titulo %} Inicio {% endblock %}
{% block contenido %}

<style>
    .small-box {
        display: flex;
        flex-direction: column; 
        justify-content: center; 
        align-items: center;
        max-height: 100%;  
        border-radius: 10px; 
        position: relative; 
        margin-bottom: 1px; /* Espacio inferior entre cajas */
    }

    .small-box .icon {
        color: rgba(0, 0, 0, 0.15);
        font-size: 70px;  
        position: absolute;  
        top: 10px;  
        right: 15px;  
        z-index: 0; 
    }

    .small-box h4 {
        color: #ffffff; 
    }

    .small-box h1 {
        color: white; 
        font-weight: bold; 
        font-size: 3rem;
        display: block; 
    }
    
    .numero-con-icono {
        display: flex;
        justify-content: space-between; /* Alinea el número y el ícono en extremos opuestos */
        align-items: center;
        color: white;
        font-weight: bold;
        font-size: 3rem;
    }
    
    
    .small-box .small-box-footer {
        background: rgba(0, 0, 0, 0.1);
        color: #000;
        display: block;
        padding: 3px 0;
        position: relative;
        text-align: center;
        text-decoration: none;
        z-index: 10;
    }
</style>

    <div class="container-fluid p-0">
        <h1 class="h3 mb-3"><strong>Panel de análisis</strong></h1>
    </div>

    <!-- Scripts al final del body -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <!-- AdminLTE JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.1/dist/js/adminlte.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <!-- Adaptador de fechas para Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

    <!-- Mapa -->
    <script src="https://cdn.jsdelivr.net/npm/jqvmap@1.5.1/dist/jquery.vmap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jqvmap@1.5.1/dist/maps/jquery.vmap.world.js"></script>

    
{% endblock %}
