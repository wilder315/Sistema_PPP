{% extends "/gestion_academica/index.html" %}
{% block titulo %} Línea de desarrollo {% endblock %}
{% block contenido %}

<nav style="--bs-breadcrumb-divider: '>'" aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('router_main.index') }}">Inicio</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('router_main.gestion_academica') }}">Módulo de Gestión Académica</a></li>
        <li class="breadcrumb-item active" aria-current="page">Línea de desarrollo</li>
    </ol>
</nav>

<div class="container-fluid my-4">
    <div class="card w-100">
        <div class="card-header bg-red-usat text-white" id="headingOne" data-bs-toggle="collapse"
        data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
            Líneas de desarrollo
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table id="table-linea" class="table table-striped table-lineaes" style="width:100%">
                    <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-center">Nombre</th>
                            <th class="text-center">Escuela</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Opciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los datos se cargarán dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL LÍNEA DE DESARROLLO -->
<div class="modal fade" id="modalLineaDesarrollo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formLineaDesarrollo">
                    <input type="hidden" id="idLineaMod" name="idLineaMod">
                    
                    <!-- Validación para el nombre: Solo letras -->
                    <div class="mb-3">
                        <label for="nombreLineaMod" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombreLineaMod" name="nombreLineaMod" required
                            pattern="[A-Za-zÀ-ÿ\u00f1\u00d1\s]+" title="Solo letras y espacios"
                            oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ\u00f1\u00d1\s]/g, '')">
                    </div>

                    <div class="mb-3">
                        <label for="escuelaLineaMod" class="form-label">Escuela:</label>
                        <select class="form-control" id="escuelaLineaMod" name="escuelaLineaMod" required>
                            <option value="" disabled selected>Seleccionar escuela</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="estadoMod" class="form-label">Estado:</label>
                        <select class="form-control" id="estadoMod" name="estadoMod" required>
                            <option value="" disabled selected>Seleccionar estado</option>
                            <option value="A">Activo</option>
                            <option value="I">Inactivo</option>
                        </select>
                    </div>

                    <div class="text-end">
                        <button type="button" class="btn btn-danger" id="btnCancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                        <button type="button" class="btn btn-danger" id="btnCerrar" data-bs-dismiss="modal">Cerrar</button>
                    </div>   
                </form>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.4/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.print.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

<script>
    $(document).ready(function () {
        if ($.fn.DataTable.isDataTable('#table-linea')) {
            $('#table-linea').DataTable().clear().destroy();
        }
        var table = $('#table-linea').DataTable({
            paging: true,
            pageLength: 10,
            lengthMenu: [5, 10, 15, 20],
            info: true,
            responsive: true,
            autoWidth: true,
            searching: true,
            order: [], 
            dom: '<"top-controls d-flex justify-content-between"fB>rt<"bottom-controls"ip>',
            buttons: [
                {
                    text: '<i class="fas fa-plus"></i> Agregar Nueva Linea de desarrollo  ',
                    className: 'btnAgregar btn btn-primary mb-2',
                    action: function (e, dt, node, config) {
                        e.preventDefault();
                        $('#formLineaDesarrollo')[0].reset();
                        $('#modalLineaDesarrollo').modal('show');
                    }
                },   
                {
                    extend: 'collection',
                    text: '<i class="fas fa-file-export"></i> Exportar/Imprimir',
                    className: 'btn btn-secondary mb-2',
                    autoClose: true,
                    buttons: [
                        { extend: 'copy', text: '<i class="fas fa-copy"></i> Copiar', className: 'dropdown-item' },
                        { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', className: 'dropdown-item' },
                        { extend: 'excel', text: '<i class="fas fa-file-excel"></i> Excel', className: 'dropdown-item' },
                        { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', className: 'dropdown-item' },
                        { extend: 'print', text: '<i class="fas fa-print"></i> Imprimir', className: 'dropdown-item' }
                    ]
                }
                
            ],
            ajax: {
                url: "/datos_lineas_desarrollo",
                type: "GET",
                dataSrc: ""
            },
            processing: true,
            serverSide: false,
            columns: [
                { data: "idLinea", className: 'text-center'},
                { data: "nombre"},
                { data: "Escuela"},
                { 
                    data: "estado",
                    className: 'text-center',
                    render: function (data, type, row) {
                        return data === 'A' ? 'Activo' : 'Inactivo';
                    }
                },
                {
                    data: null, 
                    className: 'text-center',
                    render: function (data, type, row) {
                        return `
                            <button class="btn btn-primary btn-sm btnVer" data-id="${row.idLinea}" title="Ver"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-warning btn-sm btnModificar" data-id="${row.idLinea}" title="Modificar"><i class="fas fa-pencil-alt"></i></button>
                            <button class="btn btn-danger btn-sm btnEliminar" data-id="${row.idLinea}" data-nombre="${row.nombre}" title="Eliminar"><i class="fas fa-trash-alt"></i></i></button>
                            <button class="btn btn-secondary btn-sm btnDarDeBaja" data-id="${row.idLinea}" data-nombre="${row.nombre}" title="Dar de Baja"><i class="fas fa-arrow-down"></i></button>
                        `;
                    }
                }
            ],
            language: {
                url: "{{ url_for('static', filename='js/es-ES.json') }}"
            }
        });

        // Función para mostrar alerta
        function mostrarAlerta(tipo, titulo, mensaje) {
            Swal.fire({
                icon: tipo,
                title: titulo,
                html: mensaje,
                showConfirmButton: true,
                timer: 5000
            });
        }

        function cargarEscuelas(selectedEscuelaId) {
            $.ajax({
                url: '/datos_escuelas',
                type: 'GET',
                contentType: 'application/json',
                success: function (response) {
                    var escuelaSelect = $('#escuelaLineaMod');
                    escuelaSelect.empty();
                    escuelaSelect.append('<option value="" disabled selected>Seleccionar escuela</option>');
                    response.forEach(function (escuela) {
                        var selected = escuela.idEscuela == selectedEscuelaId ? 'selected' : '';
                        escuelaSelect.append(`<option value="${escuela.idEscuela}" ${selected}>${escuela.nombre}</option>`);
                    });
                },
                error: function (xhr, status, error) {
                    mostrarAlerta("error", "Error", "Hubo un error al cargar las escuelas.");
                }
            });
        }

        // Función para deshabilitar los controles
        function deshabilitarControles(){
            $('#idLineaMod').prop('disabled', true);
            $('#nombreLineaMod').prop('disabled', true);
            $('#escuelaLineaMod').prop('disabled', true);
            $('#estadoMod').prop('disabled', true);
        }

        // Función para habilitar los controles
        function habilitarControles(){
            $('#idLineaMod').prop('disabled', false);
            $('#nombreLineaMod').prop('disabled', false);
            $('#escuelaLineaMod').prop('disabled', false);
            $('#estadoMod').prop('disabled', false);
        }

        // Evento para Ver Linea de desarrollo
        $('#table-linea tbody').on('click', '.btnVer', function () {
            var id = $(this).data('id');
            $.ajax({
                url: '/obtener_linea_desarrollo_por_id/' + id,
                type: 'GET',
                contentType: 'application/json',
                success: function (response) {
                    if (response.error) {
                        mostrarAlerta("error", "Error", response.error);
                    } else {
                        $('#modal-title').text("Ver Linea de desarrollo");
                        $('#formLineaDesarrollo')[0].reset();
                        $('#idLineadMod').val(response.idLinea);
                        $('#nombreLineaMod').val(response.nombre);
                        $('#estadoMod').val(response.estado);
                        cargarEscuelas(response.idEscuela);
                        deshabilitarControles();
                        $('#btnCancelar').hide();
                        $('#btnGuardar').hide();
                        $('#btnCerrar').show();
                        $('#modalLineaDesarrollo').modal('show');
                    }
                },
                error: function (xhr, status, error) {
                    mostrarAlerta("error", "Error", "Hubo un error al obtener la facultad.");
                }
            });
        });

        // Evento para Agregar Facultad
        $(document).on('click', '.btnAgregar', function (e) {
            e.preventDefault();
            $('#modal-title').text("Agregar Linea de Desarrollo");
            $('#formLineaDesarrollo')[0].reset();
            $('#idLineaMod').val('');
            $('#nombreLineaMod').val('');
            cargarEscuelas();
            $('#estadoMod').val('');
            habilitarControles();
            $('#btnCancelar').show();
            $('#btnGuardar').show();
            $('#btnCerrar').hide();
            $('#modalLineaDesarrollo').modal('show');
        });

        // Evento para Modificar Facultad
        $('#table-linea tbody').on('click', '.btnModificar', function () {
            var id = $(this).data('id');
            $.ajax({
                url: '/obtener_linea_desarrollo_por_id/' + id,
                type: 'GET',
                contentType: 'application/json',
                success: function (response) {
                    if (response.error) {
                        mostrarAlerta("error", "Error", response.error);
                    } else {
                        $('#modal-title').text("Modificar Linea de desarrollo");
                        $('#formLineaDesarrollo')[0].reset();
                        $('#idLineaMod').val(response.idLinea);
                        $('#nombreLineaMod').val(response.nombre);
                        cargarEscuelas(response.idEscuela);
                        $('#estadoMod').val(response.estado);
                        habilitarControles();
                        $('#btnCancelar').show();
                        $('#btnGuardar').show();
                        $('#btnCerrar').hide();
                        $('#modalLineaDesarrollo').modal('show');
                    }
                },
                error: function (xhr, status, error) {
                    mostrarAlerta("error", "Error", "Hubo un error al obtener la linea de desarrollo.");
                }
            });
        });

        $('#formLineaDesarrollo').submit(function (e) {
            e.preventDefault();
            if ($('#idLineaMod').val() === '') {
                var data = {
                    nombre: $('#nombreLineaMod').val(),
                    idEscuela: $('#escuelaLineaMod').val(),
                    estado: $('#estadoMod').val(),
                };
                $.ajax({
                    url: '/agregar_linea_desarrollo',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (response) {
                        if (response.error) {
                            mostrarAlerta("error", "Error", response.error);
                        } else {
                            mostrarAlerta("success", "Éxito", response.mensaje);
                            table.ajax.reload();
                            $('#modalLineaDesarrollo').modal('hide');
                        }
                    },
                    error: function (xhr, status, error) {
                        mostrarAlerta("error", "Error", "Hubo un error al agregar la facultad.");
                    }
                });
            } else {
                var data = {
                    idLinea: $('#idLineaMod').val(),
                    nombre: $('#nombreLineaMod').val(),
                    idEscuela: $('#escuelaLineaMod').val(),
                    estado: $('#estadoMod').val(),
                };
                $.ajax({
                    url: '/modificar_linea_desarrollo',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (response) {
                        if (response.error) {
                            mostrarAlerta("error", "Error", response.error);
                        } else {
                            mostrarAlerta("success", "Éxito", response.mensaje);
                            table.ajax.reload();
                            $('#modalLineaDesarrollo').modal('hide');
                        }
                    },
                    error: function (xhr, status, error) {
                        mostrarAlerta("error", "Error", "Hubo un error al modificar la facultad.");
                    }
                });
            }
        });

        // Evento para Eliminar Facultad
        $('#table-linea tbody').on('click', '.btnEliminar', function () {
            var id = $(this).data('id');
            var nombre = $(this).data('nombre');
            $('#modal-title-confirmar').text('Eliminar Linea de desarrollo');
            $('#texto-confirmar').text('¿Estás seguro de que deseas eliminar la línea de desarrollo ');
            $('#nombreLineaConfirmar').text(nombre);
            $('#idLineaConfirmar').val(id);
            $('#confirmarLinea').data('accion', 'eliminar');
            $('#modalConfirmar').modal('show');
        });

        // Evento para Dar de Baja Facultad
        $('#table-linea tbody').on('click', '.btnDarDeBaja', function () {
            var id = $(this).data('id');
            var nombre = $(this).data('nombre');
            $('#modal-title-confirmar').text('Dar de Baja Facultad');
            $('#texto-confirmar').text('¿Estás seguro de que deseas dar de baja la línea de desarrollo ');
            $('#nombreLineaConfirmar').text(nombre);
            $('#idLineaConfirmar').val(id);
            $('#confirmarLinea').data('accion', 'darDeBaja');
            $('#modalConfirmar').modal('show');
        });

        // Evento para Confirmar
        $('#confirmarLinea').click(function () {
            var id = $('#idLineaConfirmar').val();
            var accion = $(this).data('accion');
            var url = '';
            var mensajeExito = '';
            var mensajeError = '';
            if (accion === 'eliminar') {
                url = '/eliminar_linea_desarrollo';
                mensajeExito = 'La Línea de desarrollo fue eliminado correctamente';
                mensajeError = 'Hubo un error al eliminar la Linea de desarrollo.';
            } else if (accion === 'darDeBaja') {
                url = '/dar_de_baja_linea_desarrollo';
                mensajeExito = 'La Línea de desarrollo fue dada de baja correctamente';
                mensajeError = 'Hubo un error al dar de baja la línea de desarrollo.';
            }
            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ idLinea: id }),
                success: function (response) {
                    if (response.error) {
                        mostrarAlerta("error", "Error", response.error);
                    } else {
                        mostrarAlerta("success", "Éxito", mensajeExito);
                        table.ajax.reload();
                        $('#modalConfirmar').modal('hide');
                    }
                },
                error: function (xhr, status, error) {
                    mostrarAlerta("error", "Error", mensajeError);
                }
            });
        });

        

    });
</script>
{% endblock %}
{% endblock %}
